name: 缺陷报告
description: 报告可以稳定复现的功能、兼容性或数据问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实提示词、完整日志、SQLite 数据库、账号凭据、私有源码或含用户名的绝对路径。安全漏洞请使用 Security Advisory 私密报告。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现重复问题。
          required: true
        - label: 我已对路径、截图、日志和任务内容完成脱敏。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: Release 版本、Commit SHA 或分支。
      placeholder: 例如 v0.1.0 或 abc1234
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: codex_version
    attributes:
      label: Codex CLI 版本
      placeholder: codex --version 的脱敏结果
  - type: dropdown
    id: area
    attributes:
      label: 问题区域
      options:
        - 安装或启动
        - Provider 连接
        - 任务看板
        - 运行观测
        - Token 或使用分析
        - SQLite 或数据迁移
        - 界面与交互
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用不含真实业务数据的最小步骤。
      placeholder: |
        1. 启动应用
        2. 执行……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 只粘贴定位所需的最小日志；不要上传整个日志文件或数据库。
      render: text
