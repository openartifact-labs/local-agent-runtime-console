name: 功能建议
description: 建议改进现有能力或新增本地优先功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先说明用户问题，再描述方案。项目坚持本地优先、无默认遥测和 Provider 解耦。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现重复建议。
          required: true
        - label: 该建议不要求项目保存 Codex 账号密码、Token 或 Cookie。
          required: true
        - label: 我已移除示例中的个人路径、真实任务和其他敏感信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前工作流中的具体困难，不要只写功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明交互、数据来源和预期结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明尝试过的其他方法及其不足。
  - type: textarea
    id: privacy
    attributes:
      label: 隐私与安全影响
      description: 是否新增网络访问、文件权限、命令执行、数据保存或第三方服务？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可以附脱敏草图或截图，不要包含真实运行数据。
